name: Security & Secret Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly security scan on Sundays at midnight UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks & Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔒 Local Repository Secret & Rule Scan
        run: node scripts/securityScan.js

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛡️ Audit Backend Production Dependencies
        run: npm --prefix backend audit --omit=dev || true

      - name: 🛡️ Audit Frontend Production Dependencies
        run: npm --prefix frontend audit --omit=dev || true
